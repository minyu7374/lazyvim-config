# Kitty / Vim / smart-splits v3 navigation.
map ctrl+h neighboring_window left
map ctrl+j neighboring_window bottom
map ctrl+k neighboring_window top
map ctrl+l neighboring_window right
map ctrl+backslash nth_window -1

map --when-focus-on "var:IS_VIM=true or var:IS_NVIM" ctrl+h
map --when-focus-on "var:IS_VIM=true or var:IS_NVIM" ctrl+j
map --when-focus-on "var:IS_VIM=true or var:IS_NVIM" ctrl+k
map --when-focus-on "var:IS_VIM=true or var:IS_NVIM" ctrl+l
map --when-focus-on "var:IS_VIM=true or var:IS_NVIM" ctrl+backslash

# relative_resize.py is maintained in the sibling kitty repository.
map alt+h kitten relative_resize.py left 3
map alt+j kitten relative_resize.py down 3
map alt+k kitten relative_resize.py up 3
map alt+l kitten relative_resize.py right 3
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+l

# Let the inner multiplexer handle movement and resizing.
map --when-focus-on "var:IS_TMUX=true or var:IS_HERDR=true or title:^tmux: or title:^herdr:" ctrl+h
map --when-focus-on "var:IS_TMUX=true or var:IS_HERDR=true or title:^tmux: or title:^herdr:" ctrl+j
map --when-focus-on "var:IS_TMUX=true or var:IS_HERDR=true or title:^tmux: or title:^herdr:" ctrl+k
map --when-focus-on "var:IS_TMUX=true or var:IS_HERDR=true or title:^tmux: or title:^herdr:" ctrl+l
map --when-focus-on "var:IS_TMUX=true or var:IS_HERDR=true or title:^tmux: or title:^herdr:" ctrl+backslash
map --when-focus-on "var:IS_TMUX=true or var:IS_HERDR=true or title:^tmux: or title:^herdr:" alt+h
map --when-focus-on "var:IS_TMUX=true or var:IS_HERDR=true or title:^tmux: or title:^herdr:" alt+j
map --when-focus-on "var:IS_TMUX=true or var:IS_HERDR=true or title:^tmux: or title:^herdr:" alt+k
map --when-focus-on "var:IS_TMUX=true or var:IS_HERDR=true or title:^tmux: or title:^herdr:" alt+l

# Refresh the Kitty connection before forwarding navigation to a persistent Herdr server.
map --when-focus-on "var:IS_HERDR=true or title:^herdr:" ctrl+h kitten herdr_keys.py ctrl+h
map --when-focus-on "var:IS_HERDR=true or title:^herdr:" ctrl+j kitten herdr_keys.py ctrl+j
map --when-focus-on "var:IS_HERDR=true or title:^herdr:" ctrl+k kitten herdr_keys.py ctrl+k
map --when-focus-on "var:IS_HERDR=true or title:^herdr:" ctrl+l kitten herdr_keys.py ctrl+l
